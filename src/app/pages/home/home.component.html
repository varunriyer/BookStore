<div class="home-wrapper">
  <span>
    <span class="books-text">Books</span
    ><span class="items-number"> ({{ books.length }} items)</span></span
  >
  <div class="book-grid">
    <app-book-card *ngFor="let book of books" [book]="book"></app-book-card>
  </div>
  <div class="paginator">
    <mat-paginator
      [length]="100"
      [pageSize]="25"
      [pageSizeOptions]="[5, 10, 25, 100]"
      aria-label="Select page"
      >></mat-paginator
    >
  </div>
</div>
